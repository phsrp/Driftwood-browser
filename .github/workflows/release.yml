# Builds the APK and publishes it as a GitHub Release whenever you push a version tag
# (for example v1.0.1). It can also be started by hand from the Actions tab (that only
# builds a test APK you can download from the run's page; it doesn't publish a release).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The version tag must match appVersion in app/build.gradle.kts (tag v1.0.1 = version 1.0.1).
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '^val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match appVersion $VERSION in app/build.gradle.kts"
            exit 1
          fi

      # The signing key lives in the repository's secrets, never in the code.
      # Every build must use the same key, or phones refuse to install it as an update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DRIFTWOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The DRIFTWOOD_KEYSTORE_BASE64 secret is missing. See CLAUDE.md / README.md."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/driftwood.jks

      - name: Build APK
        env:
          DRIFTWOOD_KEYSTORE_PATH: signing/driftwood.jks
          DRIFTWOOD_STORE_PASSWORD: ${{ secrets.DRIFTWOOD_STORE_PASSWORD }}
          DRIFTWOOD_KEY_ALIAS: ${{ secrets.DRIFTWOOD_KEY_ALIAS }}
          DRIFTWOOD_KEY_PASSWORD: ${{ secrets.DRIFTWOOD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "Driftwood-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Driftwood-${{ steps.version.outputs.version }}
          path: Driftwood-*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Driftwood-*.apk \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
